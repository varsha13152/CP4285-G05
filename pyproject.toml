[project]
name = "recsys"
version = "0.1.0"
description = "KuaiRec-based recommendation system with intent-driven retrieval"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "implicit>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
lightfm = ["lightfm>=1.17"]
llm = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
